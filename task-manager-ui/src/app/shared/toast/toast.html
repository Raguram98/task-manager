<!-- Fixed to bottom-right corner, stacks toasts vertically -->
<div class="fixed bottom-6 right-6 z-50 flex flex-col gap-3 pointer-events-none">

    @for(t of toast.toasts(); track trackById($index, t)){
    <div class="flex items-center gap-3 rounded-xl px-4 py-3 min-w-72 max-w-sm
            shadow-xl pointer-events-auto border border-slate-700
            animate-in slide-in-from-right-4 duration-300" [class]="styles(t.type)" role="alert">

        <!-- Icon circle -->
        <div class="w-8 h-8 rounded-lg flex items-center justify-center
            text-sm font-bold shrink-0" [class]="iconStyle(t.type)">
            {{icon(t.type)}}
        </div>

        <!-- Message -->
        <p class="text-sm font-medium text-slate-100 flex-1">{{t.message}}</p>

         <!-- Close button -->
        <button class="text-slate-500 hover:text-slate-200 transition-colors p-1 rounded" (click)="toast.dismiss(t.id)"
            aria-label="Dismiss">
            ✕
        </button>

    </div>
    }

</div>
